# Technical Specification Generator Pipeline Configuration

# Directories
input_dir: "input"
output_dir: "output"
context_dir: "context"

# File paths
repo_rules_path: "context/repo_rules.yaml"
guidelines_path: "context/guidelines.md"

# OpenAI configuration
# Either set OPENAI_API_KEY environment variable or uncomment and set below:
# openai_api_key: "your-api-key-here"
openai_model: "gpt-4o"

# Output configuration
generate_html: true

# LLM fallback settings
use_fallback_if_no_api: true  # Use template-based generation if no API key is available

# Logging
log_level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL 